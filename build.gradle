plugins {
    id 'com.android.application' version '9.5.0' apply false
}

configurations { javaFormatter }
dependencies { javaFormatter('com.google.googlejavaformat:google-java-format:1.22.0:all-deps') { transitive = false } }
def javaSources = fileTree('app/src') { include '**/*.java' }
tasks.register('formatJava', JavaExec) {
    classpath = configurations.javaFormatter
    mainClass = 'com.google.googlejavaformat.java.Main'
    args '--aosp', '--skip-reflowing-long-strings', '--replace'
    args javaSources.files.sort().collect { it.path }
}
tasks.register('checkJavaFormat', JavaExec) {
    classpath = configurations.javaFormatter
    mainClass = 'com.google.googlejavaformat.java.Main'
    args '--aosp', '--skip-reflowing-long-strings', '--dry-run', '--set-exit-if-changed'
    args javaSources.files.sort().collect { it.path }
}

tasks.withType(JavaExec).configureEach {
    if (name in ['formatJava', 'checkJavaFormat']) {
        ['api', 'file', 'parser', 'tree', 'util', 'code'].each {
            jvmArgs "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
        }
    }
}

tasks.register('validateLevels', Exec) {
    commandLine 'python3', file('tools/level_content.py').absolutePath
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neonhare.game'
    compileSdk 35

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', 'Neon Hare Debug'
        }
        release {
            resValue 'string', 'app_name', 'Neon Hare'
        }
        local {
            initWith release
            versionNameSuffix '-local'
            matchingFallbacks = ['release']
        }
    }

    defaultConfig {
        testInstrumentationRunner project.findProperty('testRunner') ?: 'com.neonhare.game.GameChecks'
        applicationId 'com.neonhare.game'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.4.1'
    }
}

tasks.named('preBuild') { dependsOn rootProject.tasks.named('validateLevels') }
tasks.named('check') { dependsOn rootProject.tasks.named('checkJavaFormat') }

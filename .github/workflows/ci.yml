name: Build and gameplay checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Format, content, all build variants and Android lint
        run: ./gradlew --no-daemon checkJavaFormat validateLevels assembleLocal assembleRelease lintDebug lintLocal lintRelease
      - name: Signing rejection checks
        run: ./scripts/check-signing.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual gameplay and independent chapter extension
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          enable-hw-keyboard: true
          script: |
            adb -s emulator-5554 shell wm size 960x720
            ./scripts/check-game.sh
            ./scripts/check-level-extension.sh
            ./gradlew assembleDebug
      - name: Development APK (separate debug application)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports-${{ github.sha }}
          path: app/build/reports/lint-results-*.html
          retention-days: 14

name: Build and gameplay checks
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719' # 16.0, compatible with JDK 17
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Format, content, all build variants and Android lint
        run: ./gradlew --no-daemon checkJavaFormat validateLevels assembleLocal assembleRelease lintDebug lintLocal lintRelease
      - name: Signing rejection checks
        run: ./scripts/check-signing.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual gameplay and independent chapter extension
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          enable-hw-keyboard: true
          script: |
            adb -s emulator-5554 shell wm size 960x720
            ./scripts/check-game.sh
            ./scripts/check-level-extension.sh
            ./gradlew assembleDebug
      - name: Development APK (separate debug application)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Lint reports
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-*.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports-${{ github.sha }}
          path: app/build/reports/lint-results-*.html
          retention-days: 7
